
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des utilisateurs</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            color: #333;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        #message {
            margin-top: 15px;
            color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Liste des utilisateurs</h2>

    <button onclick="getUsers()">Actualiser</button>

    <p id="message"></p>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Email</th>
                <th>Date création</th>
                <th>Date modification</th>
            </tr>
        </thead>

        <tbody id="usersTable">
        </tbody>
    </table>

</div>

<script>

    const API_URL = "http://127.0.0.1:8000/api/users";

    async function getUsers() {

        const table = document.getElementById("usersTable");
        const message = document.getElementById("message");

        message.textContent = "Chargement...";
        table.innerHTML = "";

        try {

            // Envoyer une requête GET à Laravel
            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Erreur HTTP : " + response.status);
            }

            // Convertir la réponse en JSON
            const users = await response.json();

            // Parcourir les utilisateurs
            users.forEach(user => {

                const tr = document.createElement("tr");

                const values = [
                    user.id,
                    user.name,
                    user.email,
                    user.created_at,
                    user.updated_at ?? "-"
                ];

                values.forEach(value => {
                    const td = document.createElement("td");
                    td.textContent = value;
                    tr.appendChild(td);
                });

                table.appendChild(tr);

            });

            message.textContent = users.length + " utilisateur(s) trouvé(s).";

        } catch (error) {

            message.textContent = "Erreur : " + error.message;

            console.error(error);

        }
    }

    // Charger les utilisateurs au démarrage
    getUsers();

</script>

</body>
</html>
